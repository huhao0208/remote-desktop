# 家用 NAS 部署（公网 IPv4）
# 与 srv2/docker-compose.yml 的差异只有三处：默认端口 8444、TURN 绑内网网卡、数据卷落在本目录
# 用法：cd deploy/nas && bash bootstrap.sh && docker compose up -d --build

services:
  uu-api:
    build: ../../srv2
    restart: unless-stopped
    environment:
      UU_PUBLIC_BASE: "https://${PUBLIC_HOST}:${API_PORT:-8444}"
      UU_WS_BASE: "wss://${PUBLIC_HOST}:${API_PORT:-8444}"
      UU_STUN_URLS: "stun:${PUBLIC_HOST}:3478"
      UU_TURN_URLS: "turn:${PUBLIC_HOST}:3478?transport=udp,turn:${PUBLIC_HOST}:3478?transport=tcp"
      UU_TURN_SECRET: "${TURN_SECRET}"
      UU_TURN_TTL: "86400"
      UU_RPC_TIMEOUT: "30"
    ports:
      - "${API_PORT:-8444}:8443"
    volumes:
      - ../../srv2/certs:/certs:ro
      - uu-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import socket;socket.create_connection(('127.0.0.1',8443),3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3

  turn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    network_mode: host
    command: >
      -c /dev/null --log-file=stdout
      --listening-port=3478
      --fingerprint --lt-cred-mech --use-auth-secret
      --static-auth-secret=${TURN_SECRET}
      --realm=${PUBLIC_HOST}
      --listening-ip=${TURN_PRIVATE_IP}
      --relay-ip=${TURN_PRIVATE_IP}
      --external-ip=${PUBLIC_HOST}/${TURN_PRIVATE_IP}
      --min-port=49160 --max-port=49200
      --no-cli --no-tls --no-dtls

volumes:
  uu-data: