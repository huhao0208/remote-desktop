name: uu_remote
description: UU Remote 控制端（Flutter 骨架：登录 / 设备列表 / 远控）
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.0
  web_socket_channel: ^3.0.0
  window_manager: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true