name: uu_remote
description: UU Remote 控制端（Flutter 骨架：登录 / 设备列表 / 远控）
publish_to: 'none'
version: 0.2.0+1
environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.0
  web_socket_channel: ^3.0.0
  window_manager: ^0.4.0
  flutter_webrtc: ^1.6.3
  # 自动升级要校验下载包的 sha256（GitHub Release 的 asset.digest 就是 sha256）。
  # crypto 是 Dart 官方包，纯 Dart 实现，不引入原生依赖。
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true