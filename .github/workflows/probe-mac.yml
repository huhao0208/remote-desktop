# 临时探针：确认该账号可用哪些 macOS runner 标签（手动触发，用完可删）
name: probe-mac
on:
  workflow_dispatch:

jobs:
  m14:
    runs-on: macos-14
    steps:
      - run: uname -m && sw_vers
  m15:
    runs-on: macos-15
    steps:
      - run: uname -m && sw_vers
  latest:
    runs-on: macos-latest
    steps:
      - run: uname -m && sw_vers
  m13:
    runs-on: macos-13
    steps:
      - run: uname -m && sw_vers