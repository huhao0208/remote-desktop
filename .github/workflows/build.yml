# 自动打包：四平台「服务端 + 客户端」安装包 + 测试门禁
#
# 触发：push main / 打 v* tag / 手动
# 产物（每平台一个包，内含 uu-server + uu-agent 双二进制与部署文件）：
#   uu-remote-windows-x64.zip      Windows：uu-server.exe + uu-agent.exe
#   uu-remote-macos-arm64.tar.gz   macOS Apple Silicon
#   uu-remote-macos-x64.tar.gz     macOS Intel
#   uu-remote-linux-x64.tar.gz     Linux（VPS 免 Docker 备选）
#   uu-remote-android-termux.tar.gz  Android(Termux) 源码运行包（服务端+Agent）
#   uu-remote-universal.tar.gz     全平台通用源码包（Python 3.10+）
#
# 角色说明：
#   uu-server = 服务端（装 VPS/局域网机器，含手机 H5 控制页 /control）
#   uu-agent  = 电脑被控端（Win/Mac/Linux，推屏+接受输入+可撤销关机）
#   控制端客户端（Flutter 一套代码，内置服务器地址，装上即用）：
#     uu-remote-client-flutter-macos.zip   macOS 桌面（.app 打包成 zip）
#     uu-remote-client-flutter-linux.tar.gz Linux 桌面（bundle/）
#     uu-remote-client-flutter-windows.zip Windows 桌面（uu_remote.exe + 依赖目录）
#     uu-remote-client-flutter-android-arm64-v8a.apk    安卓（近五年手机）
#     uu-remote-client-flutter-android-armeabi-v7a.apk  安卓（老机器/电视盒子）
#   手机控制端也可免安装 H5：https://<host>:8443/control
#
# 【已删除】Electron 桌面端（client-desktop/ 目录与 desktop-client job）
#   v0.1.3 起彻底移除，需要时从 git 历史取回（v0.1.2 及更早的 tag 里仍有代码）。
# 【已废弃，仅留档】android-apk(Capacitor) / ios-project(Capacitor)，
#   两者 `if: false` 且不在 release.needs 里。
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # tag 触发时上传 Release 资产

jobs:
  # ------------------------------------------------ 测试门禁（先测后打包）
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install fastapi uvicorn websockets httpx mitmproxy cryptography
      - name: Unit + integration tests
        working-directory: srv2
        run: python tests.py
      - name: Regression tests
        working-directory: srv2
        run: python tests_regression.py
      - name: E2E real-TLS via proxy
        run: python tools/e2e_proxy_test.py

  # ------------------------------------------------ 桌面/服务器独立二进制
  binary:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            sep: ";"
            ext: ".exe"
            archive: zip
          # 注：该账号不支持 macos-14 / macos-13 标签（探针实测），只能用 macos-latest(arm64)
          - os: macos-latest      # Apple Silicon
            name: macos-arm64
            sep: ":"
            ext: ""
            archive: tar
          - os: ubuntu-latest
            name: linux-x64
            sep: ":"
            ext: ""
            archive: tar
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        # aiortc/av/numpy 供 agent 的 WebRTC 媒体通道打包用（agent/webrtc_media.py）
        run: pip install fastapi "uvicorn[standard]" pyinstaller mss pillow pyautogui httpx websockets aiortc av numpy
      - name: 注入版本号
        shell: bash
        # 写 agent/_version.py 与 srv2/_version.py；两个二进制都会带上版本，
        # `/healthz` 和 `uu-agent --version` 才有得报（自更新靠它判断新旧）
        shell: bash
        run: |
          PY=$(command -v python3 || command -v python) || { echo "找不到 python"; exit 1; }
          "$PY" scripts/gen_version.py --build ${{ github.run_number }}
      - name: Build standalone binaries (server + agent)
        shell: bash
        run: |
          # --add-data 的相对路径是相对 spec 文件目录解析的，所以 spec 必须放在
          # 仓库根（.），否则会去找 build_tmp/srv2/control.html 而失败。
          # 不能改用 $PWD：Windows 上 Git Bash 的 $PWD 是 /d/a/... 形式，Python 不认。
          pyinstaller --onefile --name uu-server \
            --collect-submodules uvicorn \
            --hidden-import websockets \
            --add-data "srv2/control.html${{ matrix.sep }}." \
            --distpath dist --workpath build_tmp --specpath . \
            srv2/server.py
          # agent 的 WebRTC 通道：webrtc_media 是同目录模块、且只在函数内 import
          # （静态分析看不到），必须 hidden-import；av 带 ffmpeg 动态库，
          # --collect-all av 负责把 .so/.dylib/.dll 一起收进去。
          #
          # 用 --onedir 不用 --onefile（v0.1.3 起）：
          #   onefile 每次启动都要把 ~50MB 解压到临时目录 → 冷启 4–6s；
          #   onedir 直接加载，冷启 <1s，且 dylib 在 zip 里压缩率更高、包体更小。
          #   代价是产物从单文件变成「uu-agent + _internal/」目录，
          #   随包分发时要把整个目录摊平进客户端（见下面各 flutter-build-* job）。
          #
          # --exclude-module 那几个：tkinter 只被 pyautogui 的 mouseinfo/pymsgbox
          # （弹窗调试工具）需要，agent 从不调用，而且它们在 pyautogui 里是
          # try/except 懒加载。排除后实测 `import pyautogui` + `pyautogui.size()` 正常，
          # 单平台省 ~10MB（tcl/tk 运行库 + sounddevice 数据）。
          pyinstaller --onedir --name uu-agent \
            --collect-submodules mss \
            --collect-submodules aiortc \
            --collect-all av \
            --hidden-import webrtc_media \
            --hidden-import updater \
            --hidden-import pyautogui --hidden-import PIL \
            --exclude-module tkinter --exclude-module _tkinter \
            --exclude-module mouseinfo --exclude-module pymsgbox \
            --exclude-module sounddevice \
            --distpath dist --workpath build_tmp2 --specpath build_tmp2 \
            agent/agent.py
      - name: Stage package
        shell: bash
        run: |
          mkdir -p pkg/server pkg/client
          cp "dist/uu-server${{ matrix.ext }}" pkg/server/
          # onedir：整个 dist/uu-agent/ 搬进 pkg/client/uu-agent/
          # （内含 uu-agent[.exe] 与 _internal/，两者必须同级）
          cp -R dist/uu-agent pkg/client/
          echo "--- pkg/client/uu-agent ---"
          ls -l pkg/client/uu-agent | sed -n '1,8p'
          du -sh pkg/client/uu-agent
          cp srv2/control.html srv2/docker-compose.yml srv2/Dockerfile srv2/entrypoint.sh pkg/server/ 2>/dev/null || true
          cp README.md pkg/
          mkdir -p pkg/server/certs && touch pkg/server/certs/.gitkeep
          cat > pkg/START.md <<'EOF'
          # 一、服务端（VPS 或局域网任一机器）
          方式 A（Docker，推荐）：
            cd server
            把 TLS 证书放到 certs/fullchain.pem 与 certs/privkey.pem
            docker compose up -d --build
          方式 B（独立二进制，免装 Python/Docker）：
            cd server
            证书放 certs/ 后：
            UU_TLS_CERT=certs/fullchain.pem UU_TLS_KEY=certs/privkey.pem ./uu-server
            （Windows: 先 set 环境变量再运行 uu-server.exe）
          管理页 https://<host>:8443/admin

          # 二、电脑客户端 / 被控端（Windows / macOS / Linux）
          #     uu-agent 是目录形态（uu-agent + _internal/），拷贝/移动都要整目录，
          #     只拿可执行文件会启动失败（缺 _internal 里的 Python 运行时与 dylib）。
          cd client/uu-agent
          ./uu-agent --server https://<host>:8443 --mobile <手机号> --name MY-PC
          （Windows：cd client\uu-agent 然后 uu-agent.exe ...）
          macOS 需授予 屏幕录制 + 辅助功能 权限。
          可选画质参数：--width 1920 --quality 75 --fps 15

          # 三、手机控制端（Android / iOS 浏览器，免安装）
          打开 https://<host>:8443/control 用同一手机号登录 → 设备列表 → 点电脑控制/关机
          EOF
      - name: Archive (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path pkg/* -DestinationPath "uu-remote-${{ matrix.name }}.zip"
      - name: Archive (tar)
        if: matrix.archive == 'tar'
        run: tar -czf "uu-remote-${{ matrix.name }}.tar.gz" -C pkg .
      - uses: actions/upload-artifact@v4
        with:
          name: uu-remote-${{ matrix.name }}
          path: uu-remote-${{ matrix.name }}.*
          retention-days: 30
      # 被控端自更新专用包：只有 agent（约 47 MB），不用为升级下载 100+MB 的服务端包。
      # 归档根目录就是 onedir 的内容（uu-agent 或 uu-agent.exe 与 _internal/ 同级），
      # agent/updater.py 解压后直接覆盖安装目录。
      - name: Archive agent only (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path 'dist/uu-agent/*' -DestinationPath "uu-agent-${{ matrix.name }}.zip"
      - name: Archive agent only (tar)
        if: matrix.archive == 'tar'
        run: tar -czf "uu-agent-${{ matrix.name }}.tar.gz" -C dist/uu-agent .
      - uses: actions/upload-artifact@v4
        with:
          name: uu-agent-${{ matrix.name }}
          path: uu-agent-${{ matrix.name }}.*
          retention-days: 30

  # ------------------------------------------------ 移动端 / 通用源码包
  source-packs:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Android (Termux) pack
        run: |
          mkdir -p pack-termux
          cp srv2/server.py srv2/control.html srv2/tests.py srv2/tests_regression.py pack-termux/
          cp agent/agent.py agent/webrtc_media.py pack-termux/
          cp packaging/run-termux.sh pack-termux/run.sh
          cp srv2/README.md pack-termux/
          chmod +x pack-termux/run.sh
          tar -czf uu-remote-android-termux.tar.gz -C pack-termux .
      - name: Universal source pack
        run: |
          mkdir -p pack-universal
          cp -r srv2 tools agent pack-universal/
          rm -rf pack-universal/srv2/data pack-universal/srv2/__pycache__
          cp README.md packaging/run-anywhere.sh pack-universal/
          chmod +x pack-universal/run-anywhere.sh
          tar -czf uu-remote-universal.tar.gz -C pack-universal .
      - uses: actions/upload-artifact@v4
        with:
          name: uu-remote-mobile-and-universal
          path: |
            uu-remote-android-termux.tar.gz
            uu-remote-universal.tar.gz
          retention-days: 30

  # ------------------------------------------------ 安卓控制端 APK（Capacitor）
  # 【已废弃】改用 Flutter 安卓包（uu-remote-client-flutter-android.apk）。
  # 代码块保留以便回滚；`if: false` 让它恒跳过，也不进 release.needs。
  android-apk:
    if: false   # 已废弃，仅留档
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # ubuntu-latest 镜像已自带 Android SDK，不必再跑 setup-android
      # （它自己的 sdkmanager 在无交互环境里会因许可证未接受而 exit 1）
      - name: Accept Android licenses
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
      - name: Install deps & sync web
        run: |
          npm install --no-audit --no-fund
          node scripts/sync-web.js
          npx cap sync android
      - name: Build APK
        working-directory: client-mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk uu-remote-client-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: uu-remote-client-android
          path: client-mobile/uu-remote-client-android.apk
          retention-days: 30

  # ------------------------------------------------ iOS 控制端 Xcode 工程
  # 未签名工程：需在有 Xcode 的 Mac 上打开、选签名团队后 Archive 出 ipa。
  # 【已废弃】iOS 控制端走 Flutter（同一套代码），此 Capacitor 工程不再发布。
  # 代码块保留以便回滚；`if: false` 让它恒跳过，也不进 release.needs。
  ios-project:
    if: false   # 已废弃，仅留档
    needs: test
    runs-on: macos-latest
    defaults:
      run:
        working-directory: client-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install deps & sync web
        run: |
          npm install --no-audit --no-fund
          node scripts/sync-web.js
          npx cap sync ios
      - name: Zip Xcode project
        run: |
          cat > ios-README.txt <<'EOF'
          iOS 客户端构建说明：
          1. 在装有 Xcode 的 Mac 上解压本包
          2. 打开 ios/App/App.xcworkspace
          3. Signing & Capabilities 里选择你的 Team（个人 Apple ID 即可）
          4. Product > Archive 导出 ipa，或直接连线安装到 iPhone
          服务器地址已内置，无需配置。
          EOF
          zip -qry ../uu-remote-client-ios-project.zip ios ios-README.txt capacitor.config.json package.json
      - uses: actions/upload-artifact@v4
        with:
          name: uu-remote-client-ios-project
          path: uu-remote-client-ios-project.zip
          retention-days: 30

  # ------------------------------------------------ Flutter 控制端（client-flutter）
  # 版本必须钉 3.50.1（Dart 3.14）：工程用 material_ui 1.11.x + 3.50 模板写法，
  # 低版本 pub get 直接失败。不要为了过 CI 放松 pubspec 的 sdk 约束，升级 Flutter 才对。
  flutter-verify:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client-flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true
      - run: flutter pub get
      # 版本号单一真源在仓库根的 VERSION，这里只校验生成物没漂移。
      # 漂移会让「检查更新」判断错版本（v0.1.3 时 pubspec 还停在 0.1.0+1）。
      - name: 版本一致性
        working-directory: .
        shell: bash
        run: |
          PY=$(command -v python3 || command -v python) || { echo "找不到 python"; exit 1; }
          "$PY" scripts/gen_version.py --check
      - run: flutter analyze --fatal-infos
      - run: flutter test

  # macOS 桌面 App（runner 自带 Xcode）
  # 必须先在本地打成 zip 再上传：直接传 *.app（目录）时，release job 用
  # download-artifact merge-multiple 合并后只剩目录条目，action-gh-release
  # 会把它当成一个几十 KB 的「假文件」发出去（v0.1.0 里的 uu_remote 就是这个），
  # 用户下载后既不是 zip 也解不出 .app。ditto 是 macOS 原生打包工具，
  # --keepParent 保证解压后是 uu_remote.app/ 完整包结构（保 xattr/资源分叉）。
  flutter-build-macos:
    # binary 提供同平台的 uu-agent，塞进 .app 里当「随包被控端」（见 agent_host.dart）
    needs: [flutter-verify, binary]
    runs-on: macos-latest
    defaults:
      run:
        working-directory: client-flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true
      - run: flutter pub get
      - name: 注入版本号
        working-directory: .
        # build 号用 CI 的 run_number，保证同版本重复构建也能区分（pubspec 的 +N）
        shell: bash
        run: |
          PY=$(command -v python3 || command -v python) || { echo "找不到 python"; exit 1; }
          "$PY" scripts/gen_version.py --build ${{ github.run_number }}
      - run: flutter build macos --release
      # 客户端会拉起随包分发的被控端（lib/core/agent_host.dart 按
      # Contents/Resources/agent/uu-agent 查找），二进制由 binary job 用 PyInstaller 产出，
      # 这里从同平台的服务端/Agent 包里取出来塞进 .app。
      - uses: actions/download-artifact@v4
        with:
          name: uu-remote-macos-arm64
          path: ${{ github.workspace }}/agent-pkg
      - name: Bundle uu-agent into .app
        run: |
          set -euo pipefail
          APP_PATH="$(ls -d build/macos/Build/Products/Release/*.app | sed -n '1p')"
          mkdir -p "$GITHUB_WORKSPACE/agent-pkg/extract"
          tar -xzf "$GITHUB_WORKSPACE/agent-pkg/uu-remote-macos-arm64.tar.gz" \
            -C "$GITHUB_WORKSPACE/agent-pkg/extract" ./client/uu-agent
          SRC="$GITHUB_WORKSPACE/agent-pkg/extract/client/uu-agent"
          DST="$APP_PATH/Contents/Resources/agent"
          mkdir -p "$DST"
          # onedir 摊平：把 uu-agent 与它的 _internal/ 直接放进 Resources/agent/。
          # 这样可执行文件仍是 Resources/agent/uu-agent，agent_host.dart 的路径约定不用改；
          # 且 _internal 与可执行文件同级（PyInstaller 6 按可执行文件所在目录找 _internal）。
          cp -R "$SRC/." "$DST/"
          chmod 0755 "$DST/uu-agent"
          ls -l "$DST/uu-agent"
          ls -d "$DST/_internal"
          du -sh "$DST"
      - name: Ad-hoc sign .app
        # 顺序不能乱：先逐个签 agent 目录里的 Mach-O（av/numpy/pylibsrtp 带一堆
        # .so/.dylib，沙箱里加载未签名的动态库会被拦），最后签主程序与整个 .app。
        # 没签名时 Release.entitlements 的 app-sandbox=true 会让沙箱初始化直接
        # SIGTRAP 崩溃（_libsecinit_appsandbox）。ad-hoc 签名不是 Developer ID，
        # 只能自用，不能分发给别人的 Mac。
        run: |
          set -euo pipefail
          APP_PATH="$(ls -d build/macos/Build/Products/Release/*.app | sed -n '1p')"
          AGENT_DIR="$APP_PATH/Contents/Resources/agent"
          # 先深后浅：_internal 里的动态库先签，主程序最后签
          signed=0
          find "$AGENT_DIR/_internal" -type f -print0 | while IFS= read -r -d '' f; do
            if file -b "$f" | grep -q "Mach-O"; then
              codesign --force --sign - "$f" >/dev/null 2>&1 || echo "签名失败：$f"
              echo "$f"
            fi
          done > /tmp/signed.txt
          signed=$(wc -l < /tmp/signed.txt | tr -d ' ')
          echo "已签 _internal 内 Mach-O：$signed 个"
          sed -n '1,5p' /tmp/signed.txt
          codesign --force --sign - "$AGENT_DIR/uu-agent"
          codesign --force --deep --sign - "$APP_PATH"
          # 校验：签名信息里应出现 adhoc；顺手 verify 整个包
          codesign -dv "$APP_PATH" 2>&1 | sed -n '1,8p'
          codesign -dv "$APP_PATH" 2>&1 | grep -q "adhoc" || { echo "未拿到 ad-hoc 签名"; exit 1; }
          codesign --verify --deep --strict "$APP_PATH" && echo "codesign verify ok"
      - name: Package .app into zip
        # 顺序不能反：先签名再 ditto，签在 zip 里不会生效。
        run: |
          set -euo pipefail
          APP_PATH="$(ls -d build/macos/Build/Products/Release/*.app | sed -n '1p')"
          echo "packaging: $APP_PATH"
          # 产物落在仓库根，路径与其它 job 的资产名保持一致，release job 直接 artifacts/* 收走
          ditto -c -k --sequesterRsrc --keepParent \
            "$APP_PATH" "$GITHUB_WORKSPACE/uu-remote-client-flutter-macos.zip"
          ls -lh "$GITHUB_WORKSPACE/uu-remote-client-flutter-macos.zip"
          # 用 sed 不用 head：head 读够就关管道 → 上游 SIGPIPE，配 pipefail 会误判失败
          unzip -l "$GITHUB_WORKSPACE/uu-remote-client-flutter-macos.zip" | sed -n '1,6p'
          # 断言 agent 真的进了包，别只信构建目录（同样避开 unzip | grep -q 的 SIGPIPE）
          unzip -l "$GITHUB_WORKSPACE/uu-remote-client-flutter-macos.zip" > /tmp/pkg-list.txt
          grep -q "uu_remote.app/Contents/Resources/agent/uu-agent" /tmp/pkg-list.txt \
            || { echo "zip 里没有随包 uu-agent"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: uu-remote-client-flutter-macos
          path: uu-remote-client-flutter-macos.zip
          retention-days: 30

  # Linux 桌面 App：runner 需先装 GTK/CMake 工具链
  flutter-build-linux:
    needs: [flutter-verify, binary]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client-flutter
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop toolchain
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true
      - run: flutter pub get
      - name: 注入版本号
        working-directory: .
        shell: bash
        run: |
          PY=$(command -v python3 || command -v python) || { echo "找不到 python"; exit 1; }
          "$PY" scripts/gen_version.py --build ${{ github.run_number }}
      - run: flutter build linux --release
      # 同 macOS：把被控端整个目录摊平进 bundle/data/flutter_assets/agent/
      - uses: actions/download-artifact@v4
        with:
          name: uu-remote-linux-x64
          path: ${{ github.workspace }}/agent-pkg
      - name: Bundle uu-agent into bundle
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/agent-pkg/extract"
          tar -xzf "$GITHUB_WORKSPACE/agent-pkg/uu-remote-linux-x64.tar.gz" \
            -C "$GITHUB_WORKSPACE/agent-pkg/extract" ./client/uu-agent
          SRC="$GITHUB_WORKSPACE/agent-pkg/extract/client/uu-agent"
          DST="build/linux/x64/release/bundle/data/flutter_assets/agent"
          mkdir -p "$DST"
          cp -R "$SRC/." "$DST/"
          chmod 0755 "$DST/uu-agent"
          ls -l "$DST/uu-agent"
          ls -d "$DST/_internal"
          du -sh "$DST"
      - name: Package bundle into tarball
        # 同 macOS：bundle 是目录，直接上传会与 merge-multiple 打架，
        # v0.1.0 的 Release 里 Linux 桌面包因此整个丢失（既没有 tar 也没有目录条目）。
        # tar 而非 zip 是为了保住可执行位。
        run: |
          set -euo pipefail
          tar -czf "$GITHUB_WORKSPACE/uu-remote-client-flutter-linux.tar.gz" \
            -C build/linux/x64/release bundle
          ls -lh "$GITHUB_WORKSPACE/uu-remote-client-flutter-linux.tar.gz"
          # 同上：不能 head，SIGPIPE 会让 tar 返回错误码
          tar -tzf "$GITHUB_WORKSPACE/uu-remote-client-flutter-linux.tar.gz" | sed -n '1,5p'
          # 断言随包被控端在 tar 里。注意不能写成 tar | grep -q：
          # grep 匹配到就退出，tar 继续写会拿到 SIGPIPE，pipefail 下把整条判成失败。
          tar -tzf "$GITHUB_WORKSPACE/uu-remote-client-flutter-linux.tar.gz" > /tmp/pkg-list.txt
          grep -q "bundle/data/flutter_assets/agent/uu-agent" /tmp/pkg-list.txt \
            || { echo "tar 里没有随包 uu-agent"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: uu-remote-client-flutter-linux
          path: uu-remote-client-flutter-linux.tar.gz
          retention-days: 30

  # Windows 桌面 App：windows-latest 自带 VS 2022（含「使用 C++ 的桌面开发」工作负载），
  # 正常不需要额外装 MSVC；万一镜像变更导致 flutter build 报缺工具链，再补 setup-msbuild。
  flutter-build-windows:
    needs: [flutter-verify, binary]
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: client-flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true
      - run: flutter pub get
      - name: 注入版本号
        shell: bash
        working-directory: .
        shell: bash
        run: |
          PY=$(command -v python3 || command -v python) || { echo "找不到 python"; exit 1; }
          "$PY" scripts/gen_version.py --build ${{ github.run_number }}
      - run: flutter build windows --release
      # 同 macOS/Linux：客户端会拉起随包被控端，放到 exe 同目录的 agent\uu-agent.exe
      - uses: actions/download-artifact@v4
        with:
          name: uu-remote-windows-x64
          path: ${{ github.workspace }}/agent-pkg
      - name: Bundle uu-agent into build output
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = Join-Path $env:GITHUB_WORKSPACE 'agent-pkg'
          $zipIn = Join-Path $pkg 'uu-remote-windows-x64.zip'
          if (-not (Test-Path $zipIn)) { throw "没拿到 Agent 包：$zipIn" }
          Expand-Archive -Path $zipIn -DestinationPath (Join-Path $pkg 'extract') -Force
          # onedir：client\uu-agent\ 里是 uu-agent.exe + _internal\
          $agentDir = Join-Path $pkg 'extract\client\uu-agent'
          if (-not (Test-Path (Join-Path $agentDir 'uu-agent.exe'))) { throw "Agent 包里没有 client\uu-agent\uu-agent.exe" }
          if (-not (Test-Path (Join-Path $agentDir '_internal'))) { throw "Agent 包缺 _internal，onedir 结构不对" }
          $destDir = 'build/windows/x64/runner/Release/agent'
          New-Item -ItemType Directory -Force -Path $destDir | Out-Null
          Copy-Item -Path (Join-Path $agentDir '*') -Destination $destDir -Recurse -Force
          Get-Item (Join-Path $destDir 'uu-agent.exe') | Select-Object Name, Length | Format-List | Out-String | Write-Host
          $total = (Get-ChildItem (Join-Path $destDir '_internal') -Recurse -File | Measure-Object Length -Sum).Sum
          Write-Host ("_internal 文件数 {0}，合计 {1:N1} MB" -f `
            (Get-ChildItem (Join-Path $destDir '_internal') -Recurse -File).Count, ($total / 1MB))
      - name: Package build into zip
        # 同 macOS/Linux：Release 目录不能直接上传（merge-multiple 会拆散），先打一个 zip。
        # 解压即得 uu_remote.exe 与 flutter_windows.dll / data/ 同级，直接双击运行。
        run: |
          $ErrorActionPreference = 'Stop'
          $src = 'build/windows/x64/runner/Release'
          if (-not (Test-Path $src)) { throw "构建产物缺失：$src" }
          $zip = Join-Path $env:GITHUB_WORKSPACE 'uu-remote-client-flutter-windows.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path (Join-Path $src '*') -DestinationPath $zip -CompressionLevel Optimal
          Get-Item $zip | Select-Object Name, Length | Format-List | Out-String | Write-Host
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
          $names = @($archive.Entries | ForEach-Object { $_.FullName })
          $archive.Entries | Select-Object -First 6 FullName, Length | Format-Table -AutoSize | Out-String | Write-Host
          $archive.Dispose()
          if ($names -notcontains 'uu_remote.exe') { throw 'zip 根目录没有 uu_remote.exe，打包结构不对' }
          # Compress-Archive 在不同 PowerShell 版本里可能写 \ 或 /，两种都认
          if (-not ($names -match '^agent[\\/]uu-agent\.exe$')) { throw 'zip 里没有随包 agent\uu-agent.exe' }
          # onedir 必须连 _internal 一起进包，否则解压出来的客户端起不了被控端
          if (-not ($names -match '^agent[\\/]_internal[\\/]')) { throw 'zip 里没有 agent\_internal\，onedir 没收全' }
          Write-Host "entries: $($names.Count)，uu_remote.exe 与 agent\uu-agent.exe 均已确认"
      - uses: actions/upload-artifact@v4
        with:
          name: uu-remote-client-flutter-windows
          path: uu-remote-client-flutter-windows.zip
          retention-days: 30

  # Android APK：未配正式签名，release 包用 debug key 签名（可装可跑，不能上架）
  flutter-build-android:
    needs: flutter-verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client-flutter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true
      - run: flutter pub get
      - name: 注入版本号
        working-directory: .
        shell: bash
        run: |
          PY=$(command -v python3 || command -v python) || { echo "找不到 python"; exit 1; }
          "$PY" scripts/gen_version.py --build ${{ github.run_number }}
      # 固定 release 签名是「应用内升级」的前提：覆盖安装要求新旧包签名一致。
      # 没配 secrets 就回退 debug 签名（与以前行为一致），但会打一条警告——
      # debug 签名的包一旦换了构建机就升不上去（只会提示「应用未安装」）。
      - name: 还原 release 签名（可选）
        shell: bash
        working-directory: client-flutter/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::warning::未配置 ANDROID_KEYSTORE_B64，APK 将用 debug 签名，应用内升级会因签名不一致失败"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > app/uu-release.jks
          {
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=uu-release.jks"
          } > key.properties
          echo "已还原 release keystore（alias=$KEY_ALIAS）"
      # 按 ABI 拆分：flutter_webrtc 会把各 ABI 的 libwebrtc.so 全塞进一个包，
      # 全 ABI 包 v0.1.2 实测 88 MB；拆开后每个约 45 MB。
      # 只发 arm64-v8a（近五年手机）与 armeabi-v7a（老机器/电视盒子），
      # x86_64 只有模拟器用得上，不占用 Release 位置。
      - run: flutter build apk --release --split-per-abi
      - name: Rename APKs
        shell: bash
        run: |
          set -euo pipefail
          SRC=build/app/outputs/flutter-apk
          ls -l "$SRC"
          cp "$SRC/app-arm64-v8a-release.apk"   uu-remote-client-flutter-android-arm64-v8a.apk
          cp "$SRC/app-armeabi-v7a-release.apk" uu-remote-client-flutter-android-armeabi-v7a.apk
          ls -lh uu-remote-client-flutter-android-*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: uu-remote-client-flutter-android
          path: |
            client-flutter/uu-remote-client-flutter-android-arm64-v8a.apk
            client-flutter/uu-remote-client-flutter-android-armeabi-v7a.apk
          retention-days: 30

  # ------------------------------------------------ tag 时发布 Release
  # 只发 Flutter 客户端 + 服务端/被控端包。Electron 已删除；
  # Capacitor 两个 job（android-apk / ios-project）仍是 if: false，不列入 needs。
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [binary, source-packs,
            flutter-build-macos, flutter-build-linux, flutter-build-windows,
            flutter-build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      # 校验和清单：GitHub 自己会给每个资产返回 digest，但老版本/镜像站点不一定有，
      # 客户端 updater.dart 与 agent/updater.py 都会在 digest 缺失时回退到这份清单。
      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd artifacts
          : > SHA256SUMS
          for f in *; do
            [ "$f" = "SHA256SUMS" ] && continue
            [ -f "$f" ] || continue
            sha256sum "$f" >> SHA256SUMS
          done
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true